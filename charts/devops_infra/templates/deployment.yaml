apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.appName }}
  labels:
    {{- include "devops_infra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.global.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.global.appName }}
    spec:
      containers:
        - name: {{ .Values.global.appName }}
          image: "{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}"
          ports:
            - containerPort: {{ .Values.deployment.port }}
          envFrom:
            - configMapRef:
                name: {{ .Values.global.appName }}-common-env-vars
            - configMapRef:
                name: {{ .Values.global.appName }}-env-vars
          {{- with .Values.deployment.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
